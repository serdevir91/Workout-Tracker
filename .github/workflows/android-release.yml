name: Android Release Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Free AAB
        run: flutter build appbundle --release --flavor free --dart-define=APP_FLAVOR=free

      - name: Build Pro AAB
        run: flutter build appbundle --release --flavor pro --dart-define=APP_FLAVOR=pro

      - name: Build Free APK
        run: flutter build apk --release --flavor free --dart-define=APP_FLAVOR=free

      - name: Build Pro APK
        run: flutter build apk --release --flavor pro --dart-define=APP_FLAVOR=pro

      - name: Create GitHub Release and upload Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/freeRelease/app-free-release.aab
            build/app/outputs/bundle/proRelease/app-pro-release.aab
            build/app/outputs/flutter-apk/app-free-release.apk
            build/app/outputs/flutter-apk/app-pro-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
